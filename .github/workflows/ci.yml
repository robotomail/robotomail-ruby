name: Test SDK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: ["3.1", "3.3"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: ${{ matrix.runtime }}
          bundler-cache: true
      - name: Verify generated contract
        run: python3.12 scripts/generate.py --check
      - name: Test and build
        run: |
          bundle exec ruby -Ilib test/client_test.rb
          bundle exec gem build robotomail.gemspec
