name: Publish package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching the package version, e.g. v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: package-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: package-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3.12 scripts/check_release.py
      - run: python3.12 scripts/generate.py --check
      - name: Test and build
        run: |
          bundle exec ruby -Ilib test/client_test.rb
          bundle exec gem build robotomail.gemspec
      - name: Publish Ruby gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          test -n "$GEM_HOST_API_KEY"
          gem push robotomail-*.gem
